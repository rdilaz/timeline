
  <section class="tpl tbasic" id="tplBasic" aria-label="Timeline">
    <header class="bh">
      <div class="bmark"><span class="bdotmark" aria-hidden="true"></span>Timeline</div>
      <div class="bact"><button class="bbtn" type="button" data-act="tplpick">Templates</button><button class="bbtn pri" type="button" data-act="maker">Make yours</button></div>
    </header>
    <div class="bscroll" id="bScroll">
      <div class="bhero">
        <h1>Your life on one page.</h1>
        <p class="blead">Written by Meta Llama, on your device.</p>
        <div class="brow"><button class="bbtn pri lg" type="button" data-act="maker">Make yours</button><button class="bbtn lg" type="button" data-act="bexample">See Ryo's</button></div>
      </div>
      <div class="bwho" id="bWho"></div>
      <ol class="blist" id="bList"></ol>
      <footer class="bfoot"><div class="brow"><button class="bbtn" type="button" data-tpl="cosmos">Back to Cosmos</button></div></footer>
    </div>
  </section>

  <section class="tpl tcosmos" id="tplCosmos" aria-label="Timeline, Cosmos template" hidden>
    <canvas id="cosCanvas" aria-hidden="true"></canvas>
    <header class="bh dark">
      <div class="bmark"><span class="bdotmark" aria-hidden="true"></span>Cosmos</div>
      <div class="bact"><button class="bbtn" type="button" data-act="tplpick">Templates</button><button class="bbtn pri" type="button" data-act="maker">Make yours</button></div>
    </header>
    <p class="chint" id="cHint">Each star is a moment. The bright one is today. Rings are plans.</p>
    <div class="cpanel" id="cPanel" aria-live="polite"></div>
    <nav class="cnav" aria-label="Move between stars"><button class="bbtn" type="button" data-cos="-1">← Back</button><span id="cCount"></span><button class="bbtn" type="button" data-cos="1">Next →</button></nav>
  </section>

  <div class="veil tplveil" id="tplVeil" hidden>
    <div class="sheet tplsheet" role="dialog" aria-modal="true" aria-labelledby="tpl-h">
      <div class="mkhead"><h2 id="tpl-h">Choose a template</h2><button class="ghost" type="button" data-act="closeveil">Close</button></div>
      <p class="tplsub">Same timeline, three looks. Switch any time.</p>
      <div class="tplgrid">
        <button class="tplcard" type="button" data-tpl="cosmos"><span class="th th-cos" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><b>Cosmos</b><span>Every moment a star.</span></button>
        <button class="tplcard" type="button" data-tpl="ink"><span class="th th-ink" aria-hidden="true"><i></i></span><b>Ink scroll <em class="beta">Beta</em></b><span>A brush stroke through your life.</span></button>
        <button class="tplcard" type="button" data-tpl="basic"><span class="th th-basic" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>Basic <em class="beta">Beta</em></b><span>A plain list.</span></button>
      </div>
    </div>
  </div>
